<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog</title>
        <style>
            header {
                background-color: #183C63;
                color: aliceblue;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                border: 5px solid #447d9e;
            }
            main {
                background-color: #FFFF;
                color: #183C63;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
            }
            img {
                width: 80px;
                height: 80px;
            }
            .artigo-autor {
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Blog</h1>
            <p>Vou compartilhar conhecimentos sobre vôlei</p>  
        </header>
        <main>
            <img src="imagem-blog.png" alt="Logotipo em estilo pixel art redondo com fundo azul escuro e borda laranja. No centro, uma bola de volei branca e laranja voa sobre uma rede de vôlei azul. Na parte inferior, destaca-se o texto 'VÔLEI' e, logo abaixo, em letras menores, 'BLOG DE VÔLEI'.">
            <div>
                <h2>Meu primeiro blog</h2>
                <p class="artigo-autor">Por: Dhenzel Brayam </p>
                <p>Boas-vindas ao meu blog! Aqui vou compartilhar dicas e conhecimentos sobre o vôlei</p>
                <button>❤️<span>0</span></button>
                <button>👍<span>0</span></button>
            </div>
        </main>
    </body>
    <script>
        const botoes = document.querySelectorAll("button");
        
        botoes.forEach(function(botao) {
            botao.addEventListener("click", botaoClicado);
            
            function botaoClicado() {
                console.log("fui clicado");
                let texto = botao.querySelector("span");
                texto.textContent++;
            }
        });
    </script>
</html>
